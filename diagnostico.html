<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Diagnóstico WebXR</title><body style="font:18px system-ui;padding:20px"><h1>Diagnóstico WebXR</h1><p id="result">Verificando…</p><button id="test">Testar sessão AR e hit-test</button><pre id="log" style="white-space:pre-wrap"></pre><script>
const log = s => document.getElementById('log').textContent += s + '\n';
(async()=>{try{document.getElementById('result').textContent = navigator.xr ? 'WebXR disponível. AR imersiva: '+await navigator.xr.isSessionSupported('immersive-ar') : 'WebXR não encontrado neste navegador.'}catch(e){log('Erro: '+e.message)}})();
document.getElementById('test').onclick=async()=>{try{let s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test']});log('Sessão iniciada.');let v=await s.requestReferenceSpace('viewer');let h=await s.requestHitTestSource({space:v});log('Hit-test disponível. Mova o telefone para procurar uma superfície.');let ref=await s.requestReferenceSpace('local'), count=0;function frame(t,f){if(f.getHitTestResults(h).length && !count++){log('Superfície detectada!');s.end()}else s.requestAnimationFrame(frame)}s.requestAnimationFrame(frame);s.addEventListener('end',()=>log('Sessão encerrada.'))}catch(e){log('Falhou: '+e.name+': '+e.message)}};
</script></body></html>
